<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartTaskRouter</title>
<!-- Start-up screen: painted with the page itself, before the app's script loads, so the window never
     opens blank. main.tsx fades it out once the interface has rendered. -->
<style>
  html, body { margin: 0; height: 100%; background: #F5F5F7; }
  #splash {
    position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: #F5F5F7; color: #636366;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    transition: opacity .25s ease; -webkit-user-select: none; user-select: none; cursor: default;
  }
  #splash.done { opacity: 0; pointer-events: none; }
  #splash img { width: 72px; height: 72px; animation: splash-in .5s cubic-bezier(.2, .8, .2, 1) both; }
  #splash .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(0, 0, 0, .08); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #C2410C; animation: splash-bar 1.1s ease-in-out infinite; }
  @keyframes splash-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-color-scheme: dark) {
    html, body, #splash { background: #1E1E1E; }
    #splash { color: #A1A1A6; }
    #splash .bar { background: rgba(255, 255, 255, .1); }
    #splash .bar i { background: #FB923C; }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash img, #splash .bar i { animation: none; }
  }
</style>
</head>
<body>
<div id="splash" role="status" aria-label="SmartTaskRouter is starting">
  <img src="./src/assets/brand-mark.svg" alt=""/>
  <div class="bar"><i></i></div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
