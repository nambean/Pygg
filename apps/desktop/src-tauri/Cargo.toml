[package]
name = "smarttaskrouter-desktop"
version = "0.1.0"
description = "Pygg desktop app: task routing core, local gateway and interface shell"
edition = "2021"
publish = false
license = "MIT"
# The crate also builds the benchmark CLI (src/bin/bench.rs); the app is the default binary.
default-run = "smarttaskrouter-desktop"

[lib]
name = "smarttaskrouter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# A second launch focuses the running window instead of starting another core (and another gateway).
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: a request passed through to a provider keeps its keys in the client's order (counter-review
# CR-08), so a tool schema reaches the model as the client wrote it.
serde_json = { version = "1", features = ["preserve_order"] }
# Local store: tasks, attempts, ledger, approvals (src/db.rs). Bundled so every platform has the same SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
# Provider credentials live in the OS credential store, never in the database (src/vault.rs, ADR-002).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Agent and check processes with timeouts and cancellation (src/process.rs).
tokio = { version = "1", features = ["process", "time", "rt", "rt-multi-thread", "macros", "io-util", "io-std", "sync", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
# Local gateway (src/gateway): loopback HTTP server, and the upstream client with rustls like DownFetch.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# Client tokens are stored only as SHA-256 hashes.
sha2 = "0.10"
# `Retry-After` as an HTTP date (already in the tree through hyper).
httpdate = "1"

[target.'cfg(unix)'.dependencies]
# Ending a whole process group on timeout or cancel.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
