[package]
name = "pygg-desktop"
version = "0.1.0"
description = "Pygg desktop app: task routing core, local gateway and interface shell"
edition = "2021"
publish = false
license = "MIT"
# The crate also builds the benchmark CLI (src/bin/bench.rs); the app is the default binary.
default-run = "pygg-desktop"

[lib]
name = "pygg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The window (Tauri) is the `app` feature, on by default. `pygg-cli` and the other console programs build without it
# (`cargo build --release --no-default-features --bin pygg-cli`), so the npm package's native program builds on Linux
# and macOS with no webview libraries (ADR-037).
[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-plugin-dialog", "dep:webview2-com", "dep:windows-core"]

[[bin]]
name = "pygg-desktop"
path = "src/main.rs"
required-features = ["app"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
# A second launch focuses the running window instead of starting another core (and another gateway).
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: a request passed through to a provider keeps its keys in the client's order (counter-review
# CR-08), so a tool schema reaches the model as the client wrote it.
serde_json = { version = "1", features = ["preserve_order"] }
# Local store: tasks, attempts, ledger, approvals (src/db.rs). Bundled so every platform has the same SQLite.
rusqlite = { version = "0.42", features = ["bundled"] }
# Provider credentials live in the OS credential store, never in the database (src/vault.rs, ADR-002).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# Agent and check processes with timeouts and cancellation (src/process.rs).
tokio = { version = "1", features = ["process", "time", "rt", "rt-multi-thread", "macros", "io-util", "io-std", "sync", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
# Local gateway (src/gateway): loopback HTTP server, and the upstream client with rustls like DownFetch.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# Client tokens are stored only as SHA-256 hashes.
sha2 = "0.10"
# `Retry-After` as an HTTP date (already in the tree through hyper).
httpdate = "1"
# Codex's config.toml edited keeping its comments and layout (src/integrations.rs; already in the tree through Tauri).
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
# Opening Pygg at sign-in: the user's own Run key (HKCU), no administrator rights.
winreg = "0.55"
# The Windows version for the diagnostics bundle (src/diagnostics.rs); already in the tree through tao.
windows-version = "0.1"
# The snap layouts overlay over the green window button (src/snap.rs): the same `windows` crate tao, wry and
# tauri already use (0.62 in Cargo.lock), with the Win32 features it needs. No new crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# A web session's window reads what its page receives (websession/window.rs, 2026-11-18): WebView2's response events,
# through the webview2-com that wry already uses (0.39 in Cargo.lock). No new crate.
webview2-com = { version = "0.39", optional = true }
windows-core = { version = "0.62", optional = true }

[target.'cfg(unix)'.dependencies]
# Ending a whole process group on timeout or cancel.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux keeps credentials in the desktop's Secret Service (GNOME Keyring, KWallet), with D-Bus built in so the npm
# program needs no libdbus at run time beyond the session bus itself (ADR-037).
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tempfile = "3"
