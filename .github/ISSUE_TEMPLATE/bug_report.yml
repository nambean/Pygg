name: Bug report
description: Something in Pygg does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste an API key, a Pygg API key, a prompt you would not share, or a diagnostics bundle you have not read.** For a security problem, use the Security tab instead (see docs/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Providers > Connect Provider > ...
        2. pygg run claude, then ...
  - type: input
    id: version
    attributes:
      label: Pygg version or commit
      description: Settings > About, or `pygg --version` (the CLI) and the installer's name
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Gateway and routing, Providers, CLI Tools or `pygg` setup, Usage and cost, Web sessions, Command line / npm, Installer, Other]
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error text, `pygg doctor` output, or a request's detail from Usage (redact anything private).
      render: text
