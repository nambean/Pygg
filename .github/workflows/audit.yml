name: Dependency audit

# Known vulnerabilities in the Rust crates and npm packages Pygg ships or builds with. Runs when a lockfile changes,
# every Monday (advisories are published after a lockfile is committed) and by hand.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - apps/desktop/src-tauri/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit
      # Fails on a vulnerability. Unmaintained and unsound warnings are printed; the ones in the tree today come
      # through Tauri's Linux dependencies (zbus, glib) and are not in the Windows build.
      - run: cargo audit
        working-directory: apps/desktop/src-tauri

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit
