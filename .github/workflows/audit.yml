name: Dependency audit

# Known vulnerabilities in the Rust crates and npm packages Pygg ships or builds with. Runs when a lockfile changes,
# every Monday (advisories are published after a lockfile is committed) and by hand.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - apps/desktop/src-tauri/Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit
      # Fails on a vulnerability. Unmaintained and unsound warnings are printed; the ones in the tree today come
      # through Tauri's Linux dependencies (zbus, glib) and are not in the Windows build.
      - run: cargo audit
        working-directory: apps/desktop/src-tauri

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm audit
