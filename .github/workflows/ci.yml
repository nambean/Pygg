name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The desktop crate embeds the built interface, so it is built before the Rust tests.
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # Formatted as rustfmt.toml says.
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      # No lint warnings, in the app and in the console program built without the window (ADR-037).
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      # The library's tests and the integration tests: real provider error answers, and two gateway processes on one store.
      - run: cargo test --all-features --lib --tests
        working-directory: apps/desktop/src-tauri
      - run: python scripts/schema-reference.py --check
      # The shipped licence inventory matches Cargo.lock and the interface's packages, and every licence is allowed.
      - run: python scripts/licences.py --check
      # Every screen and the states that broke before, with long real-shaped data, at 1024, 1440 and 1990 px and at
      # Windows text sizes of 125 and 150 % (819 and 683 px): nothing
      # may be wider than the box that holds it (UI review 2026-11-14).
      - name: Layout check
        shell: pwsh
        run: |
          $dev = Start-Process -FilePath pnpm.cmd -ArgumentList 'dev' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-WebRequest http://127.0.0.1:1431 -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
          node scripts/ui-overflow-check.mjs --url http://127.0.0.1:1431
          $code = $LASTEXITCODE
          Stop-Process -Id $dev.Id -Force -ErrorAction SilentlyContinue
          exit $code
