<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img" aria-labelledby="ut ud">
<title id="ut">Using Pygg</title>
<desc id="ud">A terminal installs the Pygg command line with npm install -g @pygg/cli@dev, checks with pygg status that Pygg's gateway answers on http://127.0.0.1:8741, gives Claude Code its own Pygg key with pygg setup claude, and starts Claude Code through Pygg with pygg run claude and the model auto. The gateway sends each request to one of the providers you connected: free and cheap models, your plans, local models such as Ollama, or opt-in web sessions behind a guard.</desc>
<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101a15"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,.45)"/></filter>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
.tt{fill:#e6edf3;font-size:13px}
.tm{fill:#7d8a90;font-size:12.5px}
.tok{fill:#3fbf7f;font-size:12.5px}
.pr{fill:#3fbf7f;font-size:13px;font-weight:700}
.lbl{fill:#e6edf3;font-size:13.5px;font-weight:600}
.sub{fill:#9198a1;font-size:12px}
.cap{fill:#9198a1;font-size:11px;font-weight:600;letter-spacing:.1em}
.node{fill:#151b23;stroke:#2a333d;stroke-width:1.2}
.wire{stroke:#4d5864;stroke-width:1.4;fill:none}
.pulse{stroke:#2fb170;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-dasharray:14 400;stroke-dashoffset:414}
.anim{opacity:0}
@keyframes l0{0%{opacity:0}0.5%{opacity:0}1.1%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}@keyframes c0{0%{transform:translate(0px,0px)}2%{transform:translate(0px,0px);animation-timing-function:steps(28,end)}10%{transform:translate(225.2px,0px)}100%{transform:translate(225.2px,0px)}}@keyframes k0{0%{opacity:0}0.5%{opacity:0}1.1%{opacity:1}11%{opacity:1}11.6%{opacity:0}100%{opacity:0}}.l0{animation:l0 16s infinite}.c0{animation:c0 16s infinite}.k0{animation:k0 16s infinite}@keyframes l1{0%{opacity:0}16.5%{opacity:0}17.1%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}@keyframes c1{0%{transform:translate(0px,0px)}18%{transform:translate(0px,0px);animation-timing-function:steps(11,end)}22%{transform:translate(90.9px,0px)}100%{transform:translate(90.9px,0px)}}@keyframes k1{0%{opacity:0}16.5%{opacity:0}17.1%{opacity:1}23%{opacity:1}23.6%{opacity:0}100%{opacity:0}}.l1{animation:l1 16s infinite}.c1{animation:c1 16s infinite}.k1{animation:k1 16s infinite}@keyframes l2{0%{opacity:0}30.5%{opacity:0}31.1%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}@keyframes c2{0%{transform:translate(0px,0px)}32%{transform:translate(0px,0px);animation-timing-function:steps(17,end)}38%{transform:translate(138.3px,0px)}100%{transform:translate(138.3px,0px)}}@keyframes k2{0%{opacity:0}30.5%{opacity:0}31.1%{opacity:1}39%{opacity:1}39.6%{opacity:0}100%{opacity:0}}.l2{animation:l2 16s infinite}.c2{animation:c2 16s infinite}.k2{animation:k2 16s infinite}@keyframes l3{0%{opacity:0}50.5%{opacity:0}51.1%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}@keyframes c3{0%{transform:translate(0px,0px)}52%{transform:translate(0px,0px);animation-timing-function:steps(15,end)}57%{transform:translate(122.5px,0px)}100%{transform:translate(122.5px,0px)}}@keyframes k3{0%{opacity:0}50.5%{opacity:0}51.1%{opacity:1}58%{opacity:1}58.6%{opacity:0}100%{opacity:0}}.l3{animation:l3 16s infinite}.c3{animation:c3 16s infinite}.k3{animation:k3 16s infinite}@keyframes o0{0%{opacity:0}12%{opacity:0}12.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.o0{animation:o0 16s infinite}@keyframes o1{0%{opacity:0}24%{opacity:0}24.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.o1{animation:o1 16s infinite}@keyframes o2{0%{opacity:0}40%{opacity:0}40.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.o2{animation:o2 16s infinite}@keyframes o3{0%{opacity:0}42%{opacity:0}42.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.o3{animation:o3 16s infinite}@keyframes o4{0%{opacity:0}59%{opacity:0}59.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.o4{animation:o4 16s infinite}@keyframes dim{0%{opacity:.45}24%{opacity:.45}26%{opacity:1}95%{opacity:1}97%{opacity:.45}100%{opacity:.45}}.hub{animation:dim 16s infinite}@keyframes flowing{0%{opacity:0}59%{opacity:0}59.6%{opacity:1}95%{opacity:1}95.6%{opacity:0}100%{opacity:0}}.flowing{animation:flowing 16s infinite}@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:1}}.blink{animation:blink 1s steps(1,end) infinite}@keyframes sel{0%{stroke-dashoffset:414;opacity:1}25%{stroke-dashoffset:0;opacity:1}25.5%{opacity:0}100%{opacity:0;stroke-dashoffset:0}}@keyframes halo{0%{opacity:.14}50%{opacity:.3}100%{opacity:.14}}@keyframes flowS{0%{stroke-dashoffset:154}100%{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.anim{opacity:1}.hub{opacity:1}.pulse{opacity:0!important}.c0>rect,.c1>rect,.c2>rect,.c3>rect{opacity:0}.k0,.k1,.k2,.k3{opacity:0}.halo{opacity:.2}}</style>
