<g class="c0"><rect x="53" y="68" width="406" height="19" fill="#0a0f0d"/><g class="anim k0"><rect class="blink" x="54" y="70" width="7.5" height="15" fill="#3fbf7f"/></g></g></g><g class="anim l1"><text class="pr mono" x="38" y="138">$</text><text class="tt mono" x="54" y="138">pygg status</text>
<g class="c1"><rect x="53" y="124" width="406" height="19" fill="#0a0f0d"/><g class="anim k1"><rect class="blink" x="54" y="126" width="7.5" height="15" fill="#3fbf7f"/></g></g></g><g class="anim l2"><text class="pr mono" x="38" y="194">$</text><text class="tt mono" x="54" y="194">pygg setup claude</text>
<g class="c2"><rect x="53" y="180" width="406" height="19" fill="#0a0f0d"/><g class="anim k2"><rect class="blink" x="54" y="182" width="7.5" height="15" fill="#3fbf7f"/></g></g></g><g class="anim l3"><text class="pr mono" x="38" y="270">$</text><text class="tt mono" x="54" y="270">pygg run claude</text>
<g class="c3"><rect x="53" y="256" width="406" height="19" fill="#0a0f0d"/><g class="anim k3"><rect class="blink" x="54" y="258" width="7.5" height="15" fill="#3fbf7f"/></g></g></g><text class="anim o0 tm mono" x="54" y="104"># 0.1.0-dev.2 (tag dev): Windows, macOS, Linux</text><text class="anim o1 tok mono" x="54" y="160">Gateway   http://127.0.0.1:8741 answers</text><text class="anim o2 tok mono" x="54" y="216">✓ Its own Pygg key; no file changes</text><text class="anim o3 tm mono" x="54" y="236">Next: pygg run claude</text><text class="anim o4 tok mono" x="54" y="292">→ Claude Code through Pygg, model auto</text></g>
